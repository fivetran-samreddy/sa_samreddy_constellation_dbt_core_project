version: 2

sources:
  - name: constellation_demo
    database: sa_samreddy          # Unity Catalog catalog name
    schema: Constellation_demo
    tables:
      - name: COFFEE_PRICES_LATEST
        description: "Latest coffee price records for Constellation"
        columns:
          - name: ID
            description: "Primary key"
          - name: C_DATE
            description: "Date of the price record"
          - name: OPEN
            description: "Opening price, decimal(6,2)"
          - name: HIGH
            description: "High price for the period, decimal(6,2)"
          - name: LOW
            description: "Low price for the period, decimal(6,2)"
          - name: CLOSE
            description: "Closing price, decimal(6,2)"
          - name: VOLUME
            description: "Trade volume, decimal(38,...)"
          - name: CURRENCY
            description: "Currency code"
          - name: _fivetran_deleted
            description: "Fivetran soft-delete flag"
          - name: _fivetran_synced
            description: "Fivetran sync timestamp"
